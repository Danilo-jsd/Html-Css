<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>training</title>
</head>
<style>
    div.container{
        background-color: lightsalmon;
        height: 200px;
        display:flex; 
        flex-flow: row wrap;
        text-align: center;
        align-items: center;
        justify-content: space-between;
       
    }
    div.item{
        background-color: lightblue;
        flex: auto;
        border: 1px solid rgba(0, 0, 0, 0.66);
    }
    div#a1{
    align-self:stretch;
    }
    div#a2{
    align-self:start
    }
    div#a3{
    align-self:center
    }
    div#a4{
    align-self:end
    }
    div#a5{
    align-self:center
    }
    div#a6{
    align-self:start
    }
    div#a7{
    align-self:center
    }
    div#a8{
    align-self:end
    }
    div#a9{
    align-self:stretch
    }
</style>
<body>
    <div class="container">
        <div class="item" id="a1">A</div>
        <div class="item" id="a2">B</div>
        <div class="item" id="a3">C</div>
        <div class="item" id="a4">D</div>
        <div class="item" id="a5">E</div>
        <div class="item" id="a6">F</div>
        <div class="item" id="a7">G</div>
        <div class="item" id="a8">H</div>
        <div class="item" id="a9">I</div>
    </div>
    
</body>
</html>
