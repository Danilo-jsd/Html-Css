<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.container{
            background-color: lightsalmon;

            display: flex;
            flex-flow: row nowrap;
        }
        div.item{
            background-color: lightskyblue;
            border: 1px solid black;
            text-align: center;
            flex-basis: 230px;
            
        }
        div#p{
        flex-grow: 2;
        flex-shrink: 2;
        }
        div#s{
        flex-grow: 6;
        flex-shrink: 6;
        }
        div#t{
        flex-grow: 2;    
        flex-shrink: 2;
        }
        
    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="p">A</div>
        <div class="item" id="s">B</div>
        <div class="item" id="t">C</div>
       
    </div>
    
</body>
</html>
