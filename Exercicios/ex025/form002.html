<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de formulário</title>
</head>
<body>
    <h1>Teste de formulário</h1>
    <form action="cadastro.php" autocomplete="on" method="post">
    <p> 
        <label for="iusu">Usuário</label>
        <input type="text" name="usu" id="iusu" autocomple="username" required placeholder="Nome de Usuário" minlength="5" maxlength="15" size="15">
    </p>
    <p> 
        <label for="isen">Senha:</label>
        <input type="password" name="sen"
        id="isen" autocomplete="current-password" required placeholder="Senha" minlength="8"
        maxlength="15" size="15">
    </p>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </form>
    
</body>
</html>
