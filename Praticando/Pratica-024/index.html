<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danilo</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="imagens/halloween.png" type="image/x-icon">
</head>
<body>
    <header>
            <h1>airbnb</h1>
            <a href="#" target="_blank">Anuncie no Airbnb</a>
    </header>
    <main>
        <section>
            <div class="img">
               <img src="imagens/9caaca2d-6892-4638-b675-6a879974f5ed.avif" alt="Lugares">
               
            </div>
            <div class="ext">
                <h1>Encontre lugares para ficar <br> no Airbnb</h1>
                    <p>Descubra espaços inteiros e quartos privativos perfeitos <br> para todas as viagens.</p>
            </div>
        </section>
        <section class="form">
            <div class="formulario">
                <form action="index.html" method="post" autocomplete="on">
                    <label for="Localização"></label>
                    <input type="text" placeholder="Perto de você">
                    <label for="check-in"></label>
                    <input type="text" placeholder="Insira as datas">
                    <label for="Checkout"></label>
                    <input type="text" placeholder="Checkout">
                    <label for="Adultos"></label>
                    <input type="number" placeholder="2" maxlength="16" min="1">
                    <label for="Crianças"></label>
                    <input type="number" placeholder="0" maxlength="6" minlength="0">
                    <input type="submit" name="buscar" id="ibuscar">
                </form>
            </div>
        </section>
    </main>
    
</body>
</html>
